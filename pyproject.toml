[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kssolv-crew"
version = "0.2.1"
description = "CrewAI orchestrated Materials Project to KSSOLV band workflow"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["crewai>=1.0,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "mp-api>=0.45,<1", "pymatgen>=2025.1", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1.2"]

[project.scripts]
kssolv-crew = "kssolv_crew.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kssolv_crew = ["matlab/*.m", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires actual MATLAB, KSSOLV and explicit environment settings"]
